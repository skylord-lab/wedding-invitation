<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b0b">
<title>Srikanth & Shreya | Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#100b0b;color:#f5ead7;font-family:Montserrat,Arial,sans-serif}
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px 22px;position:relative;background:linear-gradient(#08050566,#080505dc),url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=85') center/cover}
.hero:before{content:"";position:absolute;inset:13px;border:1px solid #d9b87999}.inner{position:relative;max-width:700px;animation:rise 1.2s ease}
.k{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#d9b879}
h1{font:500 clamp(58px,12vw,96px)/.9 'Cormorant Garamond',serif;margin:28px 0}.amp{color:#d9b879;font-style:italic}
.sub{font:italic 23px 'Cormorant Garamond',serif}.line{height:1px;width:70px;background:#d9b879;margin:26px auto}
.date{font-size:11px;letter-spacing:.2em;line-height:2}
button{margin-top:30px;background:#100b0b88;border:1px solid #d9b879;color:#f5ead7;padding:16px 30px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button:hover{background:#d9b879;color:#160f0b}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style></head><body>
<main class="hero"><section class="inner">
<div class="k">With the blessings of our families</div>
<h1>Srikanth<br><span class="amp">&amp;</span> Shreya</h1>
<p class="sub">Two hearts. One beautiful beginning.</p><div class="line"></div>
<div class="date">WEDDING · 22 NOVEMBER 2026<br>RECEPTION · 26 NOVEMBER 2026</div>
<button onclick="location.href='invitation.html'">Open Invitation ↗</button>
</section></main></body></html>
